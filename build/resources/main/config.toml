# FluxMc Configuration File
#
# This file configures your Vultr instance management for Minecraft servers.
# Make sure to fill in all required values before starting the plugin.

[vultr]
# Your Vultr API key (required)
# Get this from: https://my.vultr.com/settings/#settingsapi
api_key = "YOUR_VULTR_API_KEY_HERE"

# Vultr region code (required)
# See available regions: https://api.vultr.com/v2/regions
# Examples: "ewr" (New Jersey), "lax" (Los Angeles), "fra" (Frankfurt)
region = "ewr"

# Vultr plan ID (required)
# For VX1 instances, use plans like: "vx1-g-4c-16g"
# See available plans: https://api.vultr.com/v2/plans
plan = "vx1-g-4c-16g"

# Operating System ID (required)
# See available OS: https://api.vultr.com/v2/os
# Example: 2625 = Debian 13 x64 (trixie)
os_id = 2625

# Label for your instance (required)
# This will be the name shown in Vultr dashboard
instance_label = "minecraft-server"

# Hostname for your instance (required)
hostname = "minecraft"

# Block Device ID (required for VX1 instances)
# Create a block storage volume in Vultr and paste its ID here
block_device_id = "YOUR_BLOCK_DEVICE_ID_HERE"

# SSH Key ID (optional)
# If you want SSH access, add your SSH key in Vultr and paste its ID here
# Leave empty or comment out if not needed
ssh_key_id = ""

# VPC ID (optional)
# If you want to use a VPC, paste its ID here
# Leave empty or comment out if not needed
vpc_id = ""

# Send Activation Email (optional)
# When set to true, Vultr will send an activation email to the account holder
# when an instance is created. The email is sent to the Vultr account's email address.
send_activation_email = false

[server]
# The name of the server as registered in velocity.toml
# This should match the server name in your Velocity proxy configuration
target_server_name = "minecraft"

# Maximum time to wait for server to start (in seconds)
# VX1 instances can take 2-3 minutes to fully boot
max_wait_time_seconds = 180

# How often to check if server is ready (in seconds)
check_interval_seconds = 5

# How long to wait before destroying an empty server (in minutes)
# After this time with no players, the instance will be destroyed
empty_timeout_minutes = 30

# How long to wait after server goes offline before destroying the instance (in seconds)
# This prevents destroying the instance if the server is just rebooting
# Set to 0 to disable automatic shutdown detection
shutdown_detection_delay_seconds = 60

# Destroy instance when Velocity proxy shuts down (recommended: true)
# When true: Instance is destroyed when proxy stops (via /shutdown or crash)
# When false: Instance continues running even if proxy is down
# Set to true to avoid wasting money on unused instances
destroy_on_proxy_shutdown = true

# Connection behavior when server is starting
# If true: Players are kicked with a message telling them to reconnect
# If false: Players wait in the proxy while the server starts
kick_on_startup = true

# Message shown to players when kicked (only used if kick_on_startup = true)
# Supports Minecraft color codes with & (e.g., &a for green, &c for red)
# Use \n for new lines
kick_message = "&eServer is starting!\n&7Please reconnect in &a30 seconds&7."